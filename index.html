<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 통영고 수학여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #fafaf7;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #888;
    margin-bottom: 14px;
    font-weight: 500;
  }
  h1 {
    font-family: 'Gowun Batang', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .sub {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
  }
  .divider {
    width: 30px; height: 1px;
    background: #c8402c;
    margin: 20px auto 40px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link {
    display: block;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid #e8e6e0;
    color: #1a1a1a;
    text-decoration: none;
    transition: all 0.2s;
    text-align: left;
  }
  .link:hover {
    border-color: #1a1a1a;
  }
  .link.student:hover {
    border-color: #c8402c;
  }
  .link-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .link-title {
    font-family: 'Gowun Batang', serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .link-sub {
    font-size: 12px;
    color: #555;
  }
  .link.student .link-label { color: #c8402c; }
  footer {
    margin-top: 40px;
    font-size: 11px;
    color: #888;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">TONGYEONG HIGH SCHOOL</div>
  <h1>2026 수학여행 안내</h1>
  <div class="sub">2학년 · 5월 6일 → 5월 8일</div>
  <div class="sub" style="font-family:'Gowun Batang',serif;">서울 · 용인 · 전주</div>
  <div class="divider"></div>

  <div class="links">
    <a class="link student" href="student.html">
      <div class="link-label">🎒 학생용</div>
      <div class="link-title">수학여행 안내앱</div>
      <div class="link-sub">학번 · 이름으로 로그인</div>
    </a>
    <a class="link" href="teacher.html">
      <div class="link-label">👨‍🏫 교사용</div>
      <div class="link-title">교사 관제 앱</div>
      <div class="link-sub">교사 선택 · 비밀번호 필요</div>
    </a>
  </div>

  <footer>통영고등학교 · 2학년 수학여행 담당</footer>
</div>
</body>
</html>
