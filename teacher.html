<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 수학여행 교사용 · 통영고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface-2: #242424;
  --ink: #ffffff;
  --ink-soft: #b0b0b0;
  --ink-mute: #777;
  --line: #333;
  --line-soft: #2a2a2a;
  --accent: #ff5a3c;
  --accent-soft: #3a1e18;
  --success: #4ade80;
  --warn: #fbbf24;
  --blue: #60a5fa;
  --group1: #ef4444;
  --group2: #f59e0b;
  --group3: #10b981;
  --group4: #3b82f6;
  --group5: #a855f7;
  --group6: #ec4899;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, sans-serif;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: -0.01em;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: 'Gowun Batang', serif; }
.app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--surface);
  position: relative;
}

/* ──── Login ──── */
.login {
  padding: 60px 28px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: var(--bg);
}
.login-brand {
  text-align: center;
  margin-bottom: 40px;
}
.login-brand .year {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-mute);
  margin-bottom: 14px;
  font-weight: 500;
}
.login-brand h1 {
  font-family: 'Gowun Batang', serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.login-brand .sub {
  font-size: 13px;
  color: var(--ink-soft);
}
.login-brand .divider {
  width: 30px; height: 1px;
  background: var(--accent);
  margin: 20px auto;
}
.login-form {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 32px 24px;
}
.login-form label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 8px;
  font-weight: 500;
  text-transform: uppercase;
}
.login-form select, .login-form input {
  width: 100%;
  padding: 12px 0;
  border: none;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  font-family: inherit;
  background: transparent;
  color: var(--ink);
  margin-bottom: 20px;
  outline: none;
  transition: border-color 0.2s;
}
.login-form select option { background: var(--surface); color: var(--ink); }
.login-form select:focus, .login-form input:focus { border-bottom-color: var(--accent); }
.login-form button {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.2s;
}
.login-form button:hover { background: #ff7355; }
.login-hint {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: var(--ink-mute);
}
.login-error {
  color: var(--accent);
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 18px;
}

/* ──── Main ──── */
.main { display: none; }
.main.active { display: block; }

header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .me .tag {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 2px;
  font-weight: 600;
}
header .me .name {
  font-family: 'Gowun Batang', serif;
  font-size: 18px;
  font-weight: 700;
}
header .actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
header button {
  font-size: 11px;
  color: var(--ink-soft);
  background: none;
  border: 1px solid var(--line);
  padding: 6px 10px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.03em;
}
header button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* SOS 알림 배너 */
.sos-banner {
  display: none;
  background: var(--accent);
  color: #fff;
  padding: 14px 16px;
  animation: pulse 2s infinite;
  cursor: pointer;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}
.sos-banner.active { display: block; }
.sos-banner-inner {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sos-banner-icon { font-size: 22px; }
.sos-banner-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  opacity: 0.85;
  font-weight: 600;
}
.sos-banner-body {
  font-weight: 600;
  font-size: 14px;
}

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: sticky;
  top: 62px;
  z-index: 9;
}
.tab {
  flex: 1;
  padding: 14px 8px;
  font-size: 12px;
  color: var(--ink-mute);
  text-align: center;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-weight: 500;
  transition: all 0.2s;
}
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab .badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 9px;
  padding: 1px 5px;
  margin-left: 2px;
  font-weight: 700;
  border-radius: 3px;
}

/* Panels */
.panel { display: none; animation: fadeIn 0.25s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Map panel */
#panel-map { padding: 0; }
#map {
  width: 100%;
  height: calc(100vh - 114px);
  background: var(--bg);
}
.map-controls {
  position: absolute;
  top: 124px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}
.map-ctrl-btn {
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 8px 12px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  font-weight: 500;
  letter-spacing: 0.03em;
  min-width: 80px;
  text-align: center;
}
.map-ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.map-ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.map-legend {
  position: absolute;
  bottom: 16px;
  left: 12px;
  background: rgba(26, 26, 26, 0.92);
  border: 1px solid var(--line);
  padding: 10px 12px;
  font-size: 10px;
  line-height: 1.7;
  z-index: 5;
  backdrop-filter: blur(8px);
}
.map-legend .legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  border: 2px solid #fff;
}

.map-stats {
  position: absolute;
  top: 124px;
  left: 12px;
  background: rgba(26, 26, 26, 0.92);
  border: 1px solid var(--line);
  padding: 8px 12px;
  font-size: 11px;
  z-index: 5;
  backdrop-filter: blur(8px);
}
.map-stats .k { color: var(--ink-mute); }
.map-stats .v { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Standard panel */
.panel-inner { padding: 20px 20px 60px; }
.section-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 600;
}
.section-title {
  font-family: 'Gowun Batang', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: -0.02em;
}

/* Student list */
.filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 6px 12px;
  background: var(--surface-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.02em;
}
.filter-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.search-box {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 12px;
  outline: none;
}
.search-box:focus { border-color: var(--accent); }

.student-item {
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  margin-bottom: 6px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.student-item:hover { border-color: var(--accent); }
.student-item .si-main {
  display: flex;
  align-items: center;
  gap: 10px;
}
.student-item .group-badge {
  width: 28px; height: 28px;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.student-item .si-info .nm {
  font-weight: 600;
  font-size: 14px;
}
.student-item .si-info .meta {
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 1px;
}
.student-item .si-loc {
  font-size: 10px;
  color: var(--ink-mute);
  text-align: right;
  line-height: 1.4;
}
.student-item .si-loc .fresh { color: var(--success); }
.student-item .si-loc .stale { color: var(--warn); }
.student-item .si-loc .none { color: var(--ink-mute); font-style: italic; }

/* Group view */
.group-card {
  background: var(--surface-2);
  border: 1px solid var(--line);
  margin-bottom: 14px;
  overflow: hidden;
}
.group-card-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.group-card-head .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #fff;
}
.group-card-head .gname {
  font-family: 'Gowun Batang', serif;
  font-size: 15px;
  font-weight: 700;
  flex: 1;
}
.group-card-head .gcount {
  font-size: 11px;
  color: var(--ink-mute);
}
.group-card-body {
  padding: 10px 16px;
  font-size: 12px;
}
.group-card-body .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
}
.group-card-body .row:last-child { border-bottom: none; }
.group-card-body .row .k { color: var(--ink-mute); }
.group-card-body .row .v { color: var(--ink); font-weight: 500; }

/* SOS panel */
.sos-item {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.sos-item.resolved {
  background: var(--surface-2);
  border-color: var(--line);
  opacity: 0.6;
}
.sos-item-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.sos-item-name {
  font-weight: 700;
  font-size: 15px;
  color: var(--accent);
}
.sos-item.resolved .sos-item-name { color: var(--ink-soft); }
.sos-item-time {
  font-size: 11px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}
.sos-item-meta {
  font-size: 11px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.sos-item-msg {
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
  padding: 8px 10px;
  margin-bottom: 10px;
  line-height: 1.5;
}
.sos-item-btns {
  display: flex;
  gap: 6px;
}
.sos-action {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}
.sos-action.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.sos-action:hover { opacity: 0.9; }

/* Records panel */
.record-form {
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.record-form input, .record-form textarea, .record-form select {
  width: 100%;
  padding: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 8px;
  outline: none;
}
.record-form textarea { min-height: 70px; resize: vertical; }
.record-form input:focus, .record-form textarea:focus, .record-form select:focus { border-color: var(--accent); }
.record-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.record-form button {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.05em;
}

.record-item {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--blue);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.record-item.tag-주의 { border-left-color: var(--warn); }
.record-item.tag-칭찬 { border-left-color: var(--success); }
.record-item.tag-건강 { border-left-color: var(--accent); }
.record-item.tag-기타 { border-left-color: var(--ink-mute); }
.record-item-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.record-item-target { font-weight: 600; font-size: 13px; }
.record-item-tag {
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface);
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}
.record-item-meta {
  font-size: 11px;
  color: var(--ink-mute);
  margin-bottom: 6px;
}
.record-item-body {
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
}

/* Announcement */
.announce-form {
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.announce-form input, .announce-form textarea {
  width: 100%;
  padding: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 8px;
  outline: none;
}
.announce-form textarea { min-height: 80px; resize: vertical; }
.announce-form button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.05em;
}
.announce-history-item {
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.announce-history-del {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-mute);
  font-size: 10px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: inherit;
}

/* Student detail modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 999;
  align-items: flex-end;
  justify-content: center;
}
.modal.active { display: flex; }
.modal-sheet {
  background: var(--surface);
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  border-top: 1px solid var(--line);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-head {
  padding: 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--surface);
}
.modal-head h3 {
  font-family: 'Gowun Batang', serif;
  font-size: 18px;
}
.modal-close {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  width: 32px; height: 32px;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}
.modal-body { padding: 20px; }
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--line);
  margin-bottom: 16px;
}
.detail-grid > div {
  padding: 12px 14px;
  border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
}
.detail-grid > div:nth-child(even) { border-right: none; }
.detail-grid > div:nth-last-child(-n+2) { border-bottom: none; }
.detail-grid .k {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.detail-grid .v { font-size: 14px; font-weight: 600; }
.detail-loc {
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 14px;
  margin-bottom: 12px;
}
.detail-loc-title {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-mute);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.detail-loc-time { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.detail-loc-coord { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.detail-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.detail-action {
  padding: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.detail-action.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ═══════════════════════════════════════════════════
   📷 학생 사진 섹션 (교사 조회 전용)
   ═══════════════════════════════════════════════════ */
.photos-section {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.photos-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.photos-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.photos-count {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 400;
}
.photos-filter {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.photos-filter::-webkit-scrollbar { display: none; }
.tpf-btn {
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.tpf-btn.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.t-photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

// [Firebase 설정] — 학생 앱과 동일하게 유지 (같은 DB 공유)

};

// [Kakao Map JavaScript 키] — developers.kakao.com 에서 발급

];

// 조별 마커 색상 (1~6조까지 지원)

};

let db = null;

let tCurrentViewerPhoto = null; // 뷰어에 열려있는 사진

// ═══════════════════════════════════════════════════
// Firebase 초기화
// ═══════════════════════════════════════════════════

function initFirebase() {
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.databaseURL) {
    setConn('error', 'Firebase 미설정');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
    setConn('connecting', '연결 중...');

    // Storage 초기화 (사진 조회용)
    try {
      storage = firebase.storage();
      storageReady = true;
    } catch (e) {
      console.error('Storage 초기화 실패:', e);
      storageReady = false;
    }

    // ═══════════════════════════════════════════════════════════════
    // admin.html이 올린 Firebase 데이터 → teacher.html 기대 형식 어댑터
    // admin 구조: students/{학번}.class(숫자), group(숫자), bus(숫자), room('R방번호')
    //             rooms/{R방번호}.no, floor, cap, gender
    //             groups/{번호}.name, theme, leader(학번), teacher
    // teacher 기대: s.class='2-10', s.group='1', s.bus='1호차', s.room='2501', s.floor='8층'
    //               GROUPS[n].leader={name,tel}
    // ═══════════════════════════════════════════════════════════════
    let _rawStudents = null, _rawGroups = null, _rawRooms = null;

    function _rebuildFromRaw() {
      const roomById = _rawRooms || {};

      // STUDENTS 변환
      if (_rawStudents) {
        const out = {};
        Object.entries(_rawStudents).forEach(([sid, st]) => {
          if (!st || !st.name) return;
          const classStr = (st.class !== undefined && st.class !== null && st.class !== '')
            ? `2-${st.class}` : '';
          const busStr = (st.bus !== undefined && st.bus !== null && st.bus !== '')
            ? `${st.bus}호차` : '';
          const groupStr = (st.group !== undefined && st.group !== null && st.group !== 0 && st.group !== '')
            ? String(st.group) : '';
          let roomStr = '', floorStr = '';
          if (st.room && roomById[st.room]) {
            roomStr = String(roomById[st.room].no || '');
            floorStr = roomById[st.room].floor ? `${roomById[st.room].floor}층` : '';
          } else if (st.room) {
            roomStr = String(st.room).replace(/^R/, '');
          }
          out[sid] = {
            name: st.name,
            class: classStr,
            room: roomStr,
            floor: floorStr,
            group: groupStr,
            bus: busStr,
            tel: st.tel || '',
            gender: st.gender || '',
            num: st.num
          };
        });
        STUDENTS = out;
      }

      // GROUPS 변환 (leader: 학번 → {name, tel})
      if (_rawGroups) {
        const out = {};
        Object.entries(_rawGroups).forEach(([gkey, g]) => {
          if (!g) return;
          const gStr = String(gkey);
          let leaderObj = { name: '', tel: '' };
          if (g.leader && _rawStudents && _rawStudents[g.leader]) {
            leaderObj = {
              name: _rawStudents[g.leader].name || '',
              tel: _rawStudents[g.leader].tel || ''
            };
          } else if (g.leader && typeof g.leader === 'object') {
            leaderObj = g.leader;
          }
          out[gStr] = {
            name: g.name || `${gStr}조`,
            theme: g.theme || '',
            area: g.area || g.teacher || '',
            leader: leaderObj,
            teacher: g.teacher || ''
          };
        });
        GROUPS = out;
      }

      // 렌더 갱신
      if (currentTeacher) {
        renderStudentList();
        renderGroupList();
        renderStudentFilters();
        populateRecTargets();
        updateMapMarkers();
        updateStats();
      }
    }

    db.ref(FIREBASE_PATH + '/students').on('value', snap => {
      _rawStudents = snap.val();
      _rebuildFromRaw();
    });
    db.ref(FIREBASE_PATH + '/groups').on('value', snap => {
      _rawGroups = snap.val();
      _rebuildFromRaw();
    });
    db.ref(FIREBASE_PATH + '/rooms').on('value', snap => {
      _rawRooms = snap.val();
      _rebuildFromRaw();
    });
    db.ref(FIREBASE_PATH + '/locations').on('value', snap => {
      LOCATIONS = snap.val() || {};
      if (currentTeacher) {
        renderStudentList();
        updateMapMarkers();
        updateStats();
      }
    });
    db.ref(FIREBASE_PATH + '/announcements').on('value', snap => {
      const v = snap.val() || {};
      ANNOUNCEMENTS = Object.entries(v)
        .map(([id, a]) => ({ id, ...a }))
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (currentTeacher) renderAnnounceHistory();
    });
    db.ref(FIREBASE_PATH + '/sos').on('value', snap => {
      const v = snap.val() || {};
      SOS = Object.entries(v)
        .map(([id, s]) => ({ id, ...s }))
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (currentTeacher) {
        renderSOSList();
        updateSOSBanner();
      }
    });
    db.ref(FIREBASE_PATH + '/records').on('value', snap => {
      const v = snap.val() || {};
      RECORDS = Object.entries(v)
        .map(([id, r]) => ({ id, ...r }))
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (currentTeacher) renderRecordList();
    });
    db.ref(FIREBASE_PATH + '/teacher-locations').on('value', snap => {
      TEACHER_LOCATIONS = snap.val() || {};
      if (currentTeacher) updateTeacherMarkers();
    });
    db.ref('.info/connected').on('value', snap => {
      setConn(snap.val() ? 'online' : 'offline', snap.val() ? '실시간 연결' : '오프라인');
    });
  } catch (e) {
    console.error('Firebase 초기화 실패:', e);
    setConn('error', '연결 실패');
  }
}

// Kakao Map 초기화
// ═══════════════════════════════════════════════════

function loadKakaoMap() {
  if (window.kakao && window.kakao.maps) {
    initKakaoMap();
    return;
  }
  if (!KAKAO_APP_KEY) {
    document.getElementById('map').innerHTML = `
      <div style="padding:40px 20px; text-align:center; color:var(--warn);">
        ⚠️ Kakao Map 키가 설정되지 않았습니다.
      </div>`;
    return;
  }

  // 전역 에러 캐처 (SDK 내부 에러 포착)
  const originalError = window.onerror;
  let sdkErrorCaptured = null;
  window.onerror = function(msg, src) {
    if (src && src.includes('kakao')) {
      sdkErrorCaptured = msg;
    }
    if (originalError) return originalError.apply(this, arguments);
  };

  const script = document.createElement('script');
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&autoload=false`;

  script.onload = () => {
    // 스크립트는 로드됐지만 kakao 객체가 없으면 SDK 내부 에러
    if (!window.kakao || !window.kakao.maps) {
      showMapError('SDK 로딩은 됐지만 kakao.maps 객체 없음',
        'JavaScript 키가 잘못됐거나 도메인 미등록일 가능성',
        sdkErrorCaptured);
      return;
    }
    try {
      kakao.maps.load(() => {
        try {
          initKakaoMap();
        } catch(e) {
          showMapError('지도 초기화 중 에러', e.message);
        }
      });
    } catch(e) {
      showMapError('kakao.maps.load 호출 실패', e.message);
    }
  };

  script.onerror = (e) => {
    showMapError('스크립트 로딩 실패 (script.onerror)',
      '네트워크 차단(CSP/AdBlock/회사망)이거나<br>카카오 서버 응답 오류');
  };

  document.head.appendChild(script);

  // 10초 내에 로드 안 되면 타임아웃
  setTimeout(() => {
    if (!window.kakao || !window.kakao.maps) {
      if (!document.getElementById('map').innerHTML.includes('❌')) {
        showMapError('10초 타임아웃',
          '스크립트가 로드되지 않음. 키/도메인 등록 확인 필요',
          sdkErrorCaptured);
      }
    }
  }, 10000);
}

function showMapError(title, detail, extra) {
  document.getElementById('map').innerHTML = `
    <div style="padding:30px 20px; text-align:left; color:var(--ink); max-width:440px; margin:0 auto;">
      <div style="color:var(--accent); font-weight:700; font-size:14px; margin-bottom:16px; text-align:center;">
        ❌ ${title}
      </div>
      <div style="background:var(--surface-2); padding:14px; border:1px solid var(--line); font-size:12px; line-height:1.7; color:var(--ink-soft); margin-bottom:14px;">
        ${detail}
        ${extra ? `<br><br><code style="font-size:10px; color:var(--warn);">${extra}</code>` : ''}
      </div>
      <div style="background:var(--bg); padding:12px; border-left:2px solid var(--accent); font-size:11px; color:var(--ink-mute); line-height:1.8;">
        <strong>💡 확인 순서:</strong><br>
        1. 카카오 JavaScript 키가 맞는지 (네이티브/REST키 아님)<br>
        2. 카카오 Developers 플랫폼에 <code>https://wataryu00-boop.github.io</code> 등록됐는지<br>
        3. 앱이 활성화 상태인지<br>

function initKakaoMap() {
  const container = document.getElementById('map');
  kakaoMap = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng),
    level: 7
  });
  updateMapMarkers();
  updateTeacherMarkers();
  renderLegend();
}

function updateMapMarkers() {
  if (!kakaoMap) return;
  // 기존 마커 제거
  Object.values(markers).forEach(m => m.setMap(null));
  markers = {};
  Object.values(infoWindows).forEach(i => i.close && i.close());
  infoWindows = {};

  Object.entries(LOCATIONS).forEach(([studentId, loc]) => {
    if (!loc.lat || !loc.lng) return;
    const student = STUDENTS[studentId] || { name: loc.name, group: loc.group };

    // 필터 적용
    if (currentMapFilter !== 'all' && currentMapFilter !== 'teachers') {
      const gFilter = currentMapFilter.replace('g', '');
      if (student.group !== gFilter) return;
    }
    if (currentMapFilter === 'teachers') return;

    const color = GROUP_COLORS[student.group] || '#888';
    const marker = createStudentMarker(loc, student, color);
    markers[studentId] = marker;
  });

  updateStats();
}

function createStudentMarker(loc, student, color) {
  const position = new kakao.maps.LatLng(loc.lat, loc.lng);
  const isStale = (Date.now() - (loc.ts || 0)) > 15 * 60 * 1000;

  // SVG 마커 이미지
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
    <circle cx="14" cy="14" r="11" fill="${color}" stroke="#fff" stroke-width="2" opacity="${isStale ? 0.55 : 1}"/>
    <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="sans-serif">${student.group || '?'}</text>
  </svg>`;
  const imageSrc = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const imageSize = new kakao.maps.Size(28, 28);
  const imageOption = { offset: new kakao.maps.Point(14, 14) };
  const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);

  const marker = new kakao.maps.Marker({
    position, image: markerImage, map: kakaoMap, title: student.name
  });

  const minutes = Math.round((Date.now() - (loc.ts || 0)) / 60000);
  const timeText = minutes < 1 ? '방금' : minutes < 60 ? `${minutes}분 전` : `${Math.round(minutes/60)}시간 전`;

  const iw = new kakao.maps.InfoWindow({
    content: `<div style="padding:8px 10px; font-size:12px; min-width:140px;">
      <strong>${student.name}</strong> (${student.group || '?'}조)<br>
      <span style="color:#888;">${timeText} · ±${loc.accuracy || '?'}m</span>
    </div>`
  });

  kakao.maps.event.addListener(marker, 'click', () => {
    Object.values(infoWindows).forEach(i => i.close());
    iw.open(kakaoMap, marker);
    // 학생 상세 모달도 열기
    showStudentDetail(Object.keys(LOCATIONS).find(k => LOCATIONS[k] === loc));
  });
  infoWindows[student.name] = iw;
  return marker;
}

function updateTeacherMarkers() {
  if (!kakaoMap) return;
  Object.values(teacherMarkers).forEach(m => m.setMap(null));
  teacherMarkers = {};

  if (currentMapFilter !== 'all' && currentMapFilter !== 'teachers') return;

  Object.entries(TEACHER_LOCATIONS).forEach(([name, loc]) => {
    if (!loc.lat || !loc.lng) return;
    const position = new kakao.maps.LatLng(loc.lat, loc.lng);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      <rect x="3" y="3" width="26" height="26" rx="4" fill="${TEACHER_COLOR}" stroke="#fff" stroke-width="2"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">🏫</text>
    </svg>`;
    const imageSrc = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    const markerImage = new kakao.maps.MarkerImage(imageSrc,
      new kakao.maps.Size(32, 32), { offset: new kakao.maps.Point(16, 16) });
    const marker = new kakao.maps.Marker({
      position, image: markerImage, map: kakaoMap, title: name
    });
    const iw = new kakao.maps.InfoWindow({
      content: `<div style="padding:8px 10px; font-size:12px;">
        <strong>${name} 선생님</strong><br>
        <span style="color:#888;">교사 위치</span>
      </div>`
    });
    kakao.maps.event.addListener(marker, 'click', () => iw.open(kakaoMap, marker));
    teacherMarkers[name] = marker;
  });
}

function setMapFilter(filter) {
  currentMapFilter = filter;
  document.querySelectorAll('.map-ctrl-btn[data-filter]').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  updateMapMarkers();
  updateTeacherMarkers();
}

function recenterMap() {
  if (!kakaoMap) return;
  // 모든 마커에 맞춰 zoom 조정
  const positions = Object.values(LOCATIONS)
    .filter(l => l.lat && l.lng)
    .map(l => new kakao.maps.LatLng(l.lat, l.lng));
  if (positions.length === 0) {
    kakaoMap.setCenter(new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng));
    kakaoMap.setLevel(7);
    return;
  }
  if (positions.length === 1) {
    kakaoMap.setCenter(positions[0]);
    kakaoMap.setLevel(4);
    return;
  }
  const bounds = new kakao.maps.LatLngBounds();
  positions.forEach(p => bounds.extend(p));
  kakaoMap.setBounds(bounds);
}

function renderLegend() {
  const groupNumbers = Object.keys(GROUPS).sort();
  const items = groupNumbers.map(n => {
    const g = GROUPS[n];
    return `<div class="legend-row">
      <span class="legend-dot" style="background:${GROUP_COLORS[n] || '#888'}"></span>
      <span>${n}조 ${g?.name || ''}</span>
    </div>`;
  }).join('');
  document.getElementById('mapLegend').innerHTML = items +
    `<div class="legend-row"><span class="legend-dot" style="background:${TEACHER_COLOR}"></span><span>교사</span></div>`;
}

function updateStats() {
  const total = Object.keys(STUDENTS).length;
  const recent = Object.values(LOCATIONS).filter(l =>
    l.lat && l.lng && (Date.now() - (l.ts || 0)) < 15 * 60 * 1000
  ).length;
  const el1 = document.getElementById('statVisible');
  const el2 = document.getElementById('statActive');
  if (el1) el1.textContent = total;
  if (el2) el2.textContent = recent;
}

function teacherLogin() {
  const name = document.getElementById('teacherSelect').value;
  const pw = document.getElementById('passwordInput').value;
  const err = document.getElementById('loginError');

  if (!name) { err.textContent = '선생님을 선택하세요'; return; }
  if (pw !== TEACHER_PASSWORD) { err.textContent = '비밀번호가 틀립니다'; return; }

  currentTeacher = { name };
  err.textContent = '';
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').classList.add('active');
  document.getElementById('hdrName').textContent = name + ' 선생님';
  document.getElementById('hdrTag').textContent = name === '박효덕' ? '담임 · 수학여행 담당' : '인솔 교사';

  // 전체 렌더링
  renderStudentFilters();
  renderStudentList();
  renderGroupList();
  renderSOSList();
  renderAnnounceHistory();
  renderRecordList();
  populateRecTargets();
  updateStats();

  // Kakao Map 로딩
  loadKakaoMap();

  // 교사 위치 자동 전송 시작
  startTeacherLocation();
}

function teacherLogout() {
  stopTeacherLocation();
  currentTeacher = null;
  document.getElementById('login').style.display = 'flex';
  document.getElementById('main').classList.remove('active');
  document.getElementById('passwordInput').value = '';
}

// ═══════════════════════════════════════════════════
// 교사 위치 전송
// ═══════════════════════════════════════════════════

function startTeacherLocation() {
  teacherLocationTick();
  teacherLocationInterval = setInterval(teacherLocationTick, 5 * 60 * 1000);
}

function stopTeacherLocation() {
  if (teacherLocationInterval) {
    clearInterval(teacherLocationInterval);
    teacherLocationInterval = null;
  }
}

function teacherLocationTick() {
  if (!currentTeacher || !firebaseReady) return;
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    db.ref(FIREBASE_PATH + '/teacher-locations/' + currentTeacher.name).set({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: Math.round(pos.coords.accuracy),
      ts: Date.now()
    }).catch(e => console.warn('교사 위치 전송 실패:', e));
  }, err => {
    console.warn('교사 위치 불가:', err.message);
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
}

let currentStudentFilter = 'all';

function renderStudentFilters() {
  const el = document.getElementById('studentFilters');
  if (!el) return;
  const groupKeys = Object.keys(GROUPS).sort();
  const chips = [`<button class="filter-chip active" data-filter="all" onclick="setStudentFilter('all')">전체</button>`]
    .concat(groupKeys.map(g =>
      `<button class="filter-chip" data-filter="g${g}" onclick="setStudentFilter('g${g}')">${g}조</button>`))
    .concat([`<button class="filter-chip" data-filter="unknown" onclick="setStudentFilter('unknown')">위치 없음</button>`]);
  el.innerHTML = chips.join('');
}

function setStudentFilter(f) {
  currentStudentFilter = f;
  document.querySelectorAll('#studentFilters .filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === f);
  });
  renderStudentList();
}

function renderStudentList() {
  const el = document.getElementById('studentList');
  if (!el) return;
  const search = (document.getElementById('studentSearch')?.value || '').toLowerCase().trim();

  let list = Object.entries(STUDENTS).map(([id, s]) => ({ id, ...s, loc: LOCATIONS[id] }));

  // 필터
  if (currentStudentFilter !== 'all') {
    if (currentStudentFilter === 'unknown') {
      list = list.filter(s => !s.loc || !s.loc.lat);
    } else {
      const g = currentStudentFilter.replace('g', '');
      list = list.filter(s => s.group === g);
    }
  }

  // 검색
  if (search) {
    list = list.filter(s =>
      s.name.toLowerCase().includes(search) ||
      s.id.includes(search) ||
      (s.room && s.room.includes(search))
    );
  }

  list.sort((a, b) => a.id.localeCompare(b.id));

  if (list.length === 0) {
    el.innerHTML = '<div class="empty">해당하는 학생이 없습니다</div>';
    return;
  }

  el.innerHTML = list.map(s => {
    const color = GROUP_COLORS[s.group] || '#888';
    let locHtml = '<span class="none">위치 없음</span>';
    if (s.loc && s.loc.ts) {
      const min = Math.round((Date.now() - s.loc.ts) / 60000);
      const cls = min < 15 ? 'fresh' : 'stale';
      const txt = min < 1 ? '방금' : min < 60 ? `${min}분 전` : `${Math.round(min/60)}시간 전`;
      locHtml = `<span class="${cls}">● ${txt}</span><br>±${s.loc.accuracy || '?'}m`;
    }
    return `<div class="student-item" onclick="showStudentDetail('${s.id}')">
      <div class="si-main">
        <div class="group-badge" style="background:${color}">${s.group || '?'}</div>
        <div class="si-info">
          <div class="nm">${s.name}</div>
          <div class="meta">${s.class || ''} · ${s.id} · ${s.room || '?'}호</div>
        </div>
      </div>
      <div class="si-loc">${locHtml}</div>
    </div>`;
  }).join('');
}

function renderGroupList() {
  const el = document.getElementById('groupList');
  if (!el) return;
  const groupKeys = Object.keys(GROUPS).sort();
  if (groupKeys.length === 0) {
    el.innerHTML = '<div class="empty">조 편성 데이터가 없습니다</div>';
    return;
  }
  el.innerHTML = groupKeys.map(k => {
    const g = GROUPS[k];
    const color = GROUP_COLORS[k] || '#888';
    const members = Object.entries(STUDENTS).filter(([_, s]) => s.group === k);
    const active = members.filter(([id]) => {
      const loc = LOCATIONS[id];
      return loc && loc.ts && (Date.now() - loc.ts) < 15 * 60 * 1000;
    }).length;
    return `<div class="group-card">
      <div class="group-card-head">
        <span class="dot" style="background:${color}"></span>
        <span class="gname">${k}조 · ${g.name || ''}</span>
        <span class="gcount">${active}/${members.length}명 활동</span>
      </div>
      <div class="group-card-body">
        <div class="row"><span class="k">테마</span><span class="v">${g.theme || '—'}</span></div>
        <div class="row"><span class="k">지역</span><span class="v">${g.area || '—'}</span></div>
        <div class="row"><span class="k">조장</span><span class="v">${g.leader?.name || '—'} ${g.leader?.tel ? `<a href="tel:${g.leader.tel}" style="color:var(--accent); margin-left:4px;">📞</a>` : ''}</span></div>
        <div class="row"><span class="k">집합</span><span class="v">${g.seoul?.meet || '—'}</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderSOSList() {
  const el = document.getElementById('sosList');
  if (!el) return;
  if (SOS.length === 0) {
    el.innerHTML = '<div class="empty">SOS 호출이 없습니다</div>';
    document.getElementById('sosBadge').style.display = 'none';
    return;
  }

  const unresolved = SOS.filter(s => !s.resolved).length;
  const badge = document.getElementById('sosBadge');
  if (unresolved > 0) {
    badge.textContent = unresolved;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  el.innerHTML = SOS.map(s => {
    const d = new Date(s.ts);
    const t = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const student = STUDENTS[s.studentId] || {};
    return `<div class="sos-item ${s.resolved ? 'resolved' : ''}">
      <div class="sos-item-head">
        <div class="sos-item-name">${s.resolved ? '✓ ' : '🆘 '}${s.name}</div>
        <div class="sos-item-time">${t}</div>
      </div>
      <div class="sos-item-meta">${s.class || ''} · ${s.group}조 · ${s.room || '?'}호 ${student.name && student.name !== s.name ? '· ⚠️ 이름 불일치' : ''}</div>
      <div class="sos-item-msg">${escapeHtml(s.message)}</div>
      <div class="sos-item-btns">
        ${s.lat ? `<a class="sos-action primary" href="https://map.kakao.com/link/map/${encodeURIComponent(s.name)},${s.lat},${s.lng}" target="_blank">📍 카카오맵 열기</a>` : '<span class="sos-action" style="opacity:0.5;">위치 없음</span>'}
        ${s.resolved
          ? `<button class="sos-action" onclick="unresolveSOS('${s.id}')">미해결로 복원</button>`
          : `<button class="sos-action primary" onclick="resolveSOS('${s.id}')">✓ 해결 표시</button>`
        }
      </div>
    </div>`;
  }).join('');
}

function resolveSOS(id) {
  if (!firebaseReady) return;
  db.ref(FIREBASE_PATH + '/sos/' + id).update({
    resolved: true,
    resolvedBy: currentTeacher.name,
    resolvedAt: Date.now()
  });
}

function unresolveSOS(id) {
  if (!firebaseReady) return;
  db.ref(FIREBASE_PATH + '/sos/' + id).update({ resolved: false });
}

function updateSOSBanner() {
  const banner = document.getElementById('sosBanner');
  if (!banner) return;
  const unresolved = SOS.filter(s => !s.resolved && !seenSOSIds.has(s.id));
  if (unresolved.length > 0) {
    const latest = unresolved[0];
    document.getElementById('sosBannerText').textContent = `${latest.name} (${latest.group}조): ${latest.message}`;
    document.getElementById('sosBannerCount').textContent = unresolved.length > 1 ? `(+${unresolved.length - 1})` : '';
    banner.classList.add('active');
  } else {
    banner.classList.remove('active');
  }
}

function sendAnnouncement() {
  if (!firebaseReady || !currentTeacher) return;
  const title = document.getElementById('anTitle').value.trim();
  const body = document.getElementById('anBody').value.trim();
  if (!title) { alert('공지 제목을 입력하세요'); return; }

  const ref = db.ref(FIREBASE_PATH + '/announcements').push();
  ref.set({
    title, body, author: currentTeacher.name, ts: Date.now()
  }).then(() => {
    document.getElementById('anTitle').value = '';
    document.getElementById('anBody').value = '';
    alert('✅ 공지가 모든 학생에게 전송되었습니다');
  }).catch(e => alert('전송 실패: ' + e.message));
}

function renderAnnounceHistory() {
  const el = document.getElementById('announceHistory');
  if (!el) return;
  if (ANNOUNCEMENTS.length === 0) {
    el.innerHTML = '<div class="empty">아직 공지가 없습니다</div>';
    return;
  }
  el.innerHTML = ANNOUNCEMENTS.map(a => {
    const d = new Date(a.ts || 0);
    const t = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="announce-history-item">
      <span><strong>${escapeHtml(a.title)}</strong><br><span style="color:var(--ink-mute);">${t} · ${a.author || ''}</span></span>
      <button class="announce-history-del" onclick="deleteAnnouncement('${a.id}')">삭제</button>
    </div>`;
  }).join('');
}

function deleteAnnouncement(id) {
  if (!firebaseReady) return;
  if (!confirm('이 공지를 삭제할까요?')) return;
  db.ref(FIREBASE_PATH + '/announcements/' + id).remove();
}

let currentRecFilter = 'all';

function populateRecTargets() {
  const sel = document.getElementById('recTarget');
  if (!sel) return;
  const list = Object.entries(STUDENTS).sort(([a], [b]) => a.localeCompare(b));
  sel.innerHTML = '<option value="">— 대상 학생 선택 —</option>' +
    '<option value="__all">🌐 전체 학생</option>' +
    list.map(([id, s]) => `<option value="${id}">${s.name} (${id})</option>`).join('');
}

function saveRecord() {
  if (!firebaseReady || !currentTeacher) return;
  const target = document.getElementById('recTarget').value;
  const tag = document.getElementById('recTag').value;
  const visibility = document.getElementById('recVisibility').value;
  const body = document.getElementById('recBody').value.trim();
  if (!target) { alert('대상 학생을 선택하세요'); return; }
  if (!body) { alert('기록 내용을 입력하세요'); return; }

  const student = STUDENTS[target];
  const ref = db.ref(FIREBASE_PATH + '/records').push();
  ref.set({
    targetId: target,
    targetName: target === '__all' ? '전체 학생' : (student?.name || ''),
    tag, body, visibility,
    author: currentTeacher.name,
    ts: Date.now()
  }).then(() => {
    document.getElementById('recTarget').value = '';
    document.getElementById('recBody').value = '';
    alert('✅ 기록이 저장되었습니다');
  }).catch(e => alert('저장 실패: ' + e.message));
}

function setRecFilter(f) {
  currentRecFilter = f;
  document.querySelectorAll('[data-rfilter]').forEach(c => {
    c.classList.toggle('active', c.dataset.rfilter === f);
  });
  renderRecordList();
}

function renderRecordList() {
  const el = document.getElementById('recordList');
  if (!el) return;
  let list = [...RECORDS];
  if (currentRecFilter !== 'all') {
    list = list.filter(r => r.tag === currentRecFilter);
  }
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">기록이 없습니다</div>';
    return;
  }
  el.innerHTML = list.map(r => {
    const d = new Date(r.ts || 0);
    const t = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const visTag = r.visibility === 'private' ? ' 🔒교사만' : ' 👁학생열람가능';
    return `<div class="record-item tag-${r.tag}">
      <div class="record-item-head">
        <span class="record-item-target">${escapeHtml(r.targetName)}</span>
        <span class="record-item-tag">${r.tag}${visTag}</span>
      </div>
      <div class="record-item-meta">${t} · ${r.author} 선생님</div>
      <div class="record-item-body">${escapeHtml(r.body).replace(/\n/g, '<br>')}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════
// 📷 학생 사진 조회 (교사 전용)
// ═══════════════════════════════════════════════════

// 파일명에서 태그·타임스탬프·썸네일 여부 파싱
function tParsePhotoName(name) {
  const isThumb = /_thumb\.(jpg|jpeg|png)$/i.test(name);
  const m = name.match(/^(qr|memo)_(\d+)_/);
  if (!m) return { tag: 'memo', ts: 0, isThumb };
  return { tag: m[1], ts: parseInt(m[2], 10), isThumb };
}

// 세션 내 사진 캐시 (학생별) — 재조회 시 listAll 호출 생략
const tPhotoSessionCache = new Map(); // studentId -> { photos, fetchedAt }
const T_PHOTO_CACHE_TTL = 5 * 60 * 1000; // 5분 간 유효

async function tLoadStudentPhotos(studentId) {
  if (!storageReady) {
    const grid = document.getElementById('tPhotoGrid');
    if (grid) grid.innerHTML = '<div class="photos-empty">Storage 연결 실패</div>';
    return;
  }
  // 세션 캐시 확인
  const cached = tPhotoSessionCache.get(studentId);
  if (cached && Date.now() - cached.fetchedAt < T_PHOTO_CACHE_TTL) {
    if (tCurrentStudentId === studentId) {
      tCurrentPhotos = cached.photos;
      tRenderPhotoGrid();
    }
    return;
  }

  const reqId = studentId;
  const path = `field-trip-2026/photos/${studentId}`;

  try {
    const result = await storage.ref(path).listAll();
    if (tCurrentStudentId !== reqId) return;

    if (result.items.length === 0) {
      tCurrentPhotos = [];
      tPhotoSessionCache.set(studentId, { photos: [], fetchedAt: Date.now() });
      tRenderPhotoGrid();
      return;
    }

    // 원본/썸네일 분리
    const origRefs = [];
    const thumbByBase = {};
    result.items.forEach(ref => {
      const n = ref.name;
      if (/_thumb\.(jpg|jpeg|png)$/i.test(n)) {
        const base = n.replace(/_thumb\.(jpg|jpeg|png)$/i, '');
        thumbByBase[base] = ref;
      } else if (/^(qr|memo)_\d+_/.test(n)) {
        origRefs.push(ref);
      }
    });

    // URL 병렬 조회 (원본 + 썸네일)
    const items = await Promise.all(origRefs.map(async ref => {
      try {
        const info = tParsePhotoName(ref.name);
        const baseName = ref.name.replace(/\.(jpg|jpeg|png)$/i, '');
        const thumbRef = thumbByBase[baseName];
        const [url, thumbUrl] = await Promise.all([
          ref.getDownloadURL(),
          thumbRef ? thumbRef.getDownloadURL().catch(() => null) : Promise.resolve(null)
        ]);
        return {
          name: ref.name,
          tag: info.tag,
          ts: info.ts,
          url,
          thumbUrl: thumbUrl || url
        };
      } catch (e) {
        return null;
      }
    }));
    if (tCurrentStudentId !== reqId) return;

    tCurrentPhotos = items.filter(Boolean).sort((a, b) => b.ts - a.ts);
    tPhotoSessionCache.set(studentId, { photos: tCurrentPhotos, fetchedAt: Date.now() });
    tRenderPhotoGrid();
  } catch (e) {
    console.error('사진 조회 실패:', e);
    if (tCurrentStudentId !== reqId) return;
    const grid = document.getElementById('tPhotoGrid');
    if (grid) grid.innerHTML = `<div class="photos-empty">조회 실패: ${e.message || '오류'}</div>`;
  }
}

function tRenderPhotoGrid() {
  const grid = document.getElementById('tPhotoGrid');
  if (!grid) return;

  // 카운트
  const qrN = tCurrentPhotos.filter(p => p.tag === 'qr').length;
  const memoN = tCurrentPhotos.filter(p => p.tag === 'memo').length;
  const totalN = tCurrentPhotos.length;
  const setTxt = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.textContent = v;
  };
  setTxt('tpfCountAll', totalN);
  setTxt('tpfCountQr', qrN);
  setTxt('tpfCountMemo', memoN);
  setTxt('tPhotosCount', totalN === 0 ? '(없음)' : `총 ${totalN}장 · QR ${qrN} · 기록 ${memoN}`);

  // 필터
  const filtered = tPhotoFilter === 'all'
    ? tCurrentPhotos
    : tCurrentPhotos.filter(p => p.tag === tPhotoFilter);

  if (filtered.length === 0) {
    const msg = totalN === 0
      ? '이 학생은 아직 사진을 올리지 않았어요'
      : tPhotoFilter === 'qr' ? 'QR 식권이 없어요' : '기록 사진이 없어요';
    grid.innerHTML = `<div class="photos-empty">${msg}</div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, idx) => {
    const d = new Date(p.ts);
    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const badge = p.tag === 'qr'
      ? '<div class="tpc-badge">★ QR</div>'
      : '<div class="tpc-badge memo">기록</div>';
    return `
      <div class="t-photo-cell" onclick="tOpenPhotoViewer(${idx})">
        <img src="${p.thumbUrl}" alt="사진" loading="lazy" />
        ${badge}
        <div class="tpc-time">${timeStr}</div>
      </div>
    `;
  }).join('');
}

function tOpenPhotoViewer(filteredIdx) {
  const filtered = tPhotoFilter === 'all'
    ? tCurrentPhotos
    : tCurrentPhotos.filter(p => p.tag === tPhotoFilter);
  const p = filtered[filteredIdx];
  if (!p) return;
  tCurrentViewerPhoto = p;
  const d = new Date(p.ts);
  const timeStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const tagStr = p.tag === 'qr' ? '★ QR 식권' : '기록';
  document.getElementById('tpvMeta').textContent = `${tCurrentStudentName} · ${tagStr}`;
  document.getElementById('tpvMetaSub').textContent = timeStr;
  document.getElementById('tpvImg').src = p.url;
  // 새 창으로 열기 링크
  document.getElementById('tpvNewTab').href = p.url;
  document.getElementById('tPhotoViewer').classList.add('show');
}

// 저장/공유 버튼 (플랫폼 자동 감지)
async function tSaveCurrentPhoto() {
  const p = tCurrentViewerPhoto;
  if (!p) return;
  const btn = document.getElementById('tpvSaveBtn');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '준비 중...';

  try {
    // 파일 이름
    const ext = (p.name.split('.').pop() || 'jpg').toLowerCase();
    const fname = `${tCurrentStudentName}_${p.tag}_${p.ts}.${ext}`;

    // 이미지 blob 다운로드
    const resp = await fetch(p.url);
    if (!resp.ok) throw new Error('이미지 로드 실패');
    const blob = await resp.blob();
    const file = new File([blob], fname, { type: blob.type || 'image/jpeg' });

    // 1. Web Share API 우선 시도 (iOS Safari 15+, 모바일 Chrome 등)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: fname,
          text: `${tCurrentStudentName} · ${p.tag === 'qr' ? 'QR 식권' : '기록 사진'}`
        });
        btn.textContent = origText;
        btn.disabled = false;
        return;
      } catch (shareErr) {
        // 사용자가 공유 취소하면 AbortError — 조용히 무시
        if (shareErr.name === 'AbortError') {
          btn.textContent = origText;
          btn.disabled = false;
          return;
        }
        // 다른 에러면 폴백으로 진행
      }
    }

    // 2. 폴백: blob URL로 다운로드 시도 (데스크톱)
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

  } catch (e) {
    console.error('저장 실패:', e);
    alert('저장에 실패했어요. 사진을 길게 누르거나 "새 창으로 열기"를 눌러 저장하세요.\n\n' + (e.message || ''));
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

function tClosePhotoViewer(evt) {
  if (evt && evt.target && evt.target.id !== 'tPhotoViewer' && !evt.target.classList.contains('tpv-close')) {
    return;
  }
  document.getElementById('tPhotoViewer').classList.remove('show');
  tCurrentViewerPhoto = null;
}

// 유틸
// ═══════════════════════════════════════════════════

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function goTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[data-panel="${name}"]`)?.classList.add('active');
  document.getElementById('panel-' + name)?.classList.add('active');
  if (name === 'map' && kakaoMap) {
    setTimeout(() => kakaoMap.relayout(), 100);
  }
  if (name === 'sos') {
    // 본 SOS로 표시
    SOS.forEach(s => seenSOSIds.add(s.id));
    updateSOSBanner();
  }
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => goTab(tab.dataset.panel));
});

document.getElementById('passwordInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') teacherLogin();
});

window.addEventListener('DOMContentLoaded', () => {
  populateTeachers();
  initFirebase();
